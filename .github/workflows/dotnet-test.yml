name: .NET Core Test Otomasyonu

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: .NET Kurulumu
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Dosyalari Listele (Hata Ayiklama)
      run: find . -maxdepth 3 -name "*.sln"

    - name: Bağımlılıkları Yükle
      run: dotnet restore **/WebUI.sln

    - name: Projeyi Derle
      run: dotnet build **/WebUI.sln --no-restore

    - name: Testleri Çalıştır
      run: dotnet test **/WebUI.sln --no-build --verbosity normal
