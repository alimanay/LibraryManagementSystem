name: .NET Core Test Otomasyonu

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: .NET Kurulumu
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Bağımlılıkları Yükle
      run: dotnet restore "WebUI/Kütüphane_Yonetim_Sistemi/Kütüphane_Yonetim_Sistemi.csproj"

    - name: Projeyi Derle
      run: dotnet build "WebUI/Kütüphane_Yonetim_Sistemi/Kütüphane_Yonetim_Sistemi.csproj" --no-restore

    - name: Testleri Çalıştır
      run: dotnet test "WebUI/Kütüphane_Yonetim_Sistemi/Kütüphane_Yonetim_Sistemi.csproj" --no-build --verbosity normal